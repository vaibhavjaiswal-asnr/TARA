name: TARA tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Ubuntu, Python 3.13)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install NJOY build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake gfortran

      - name: Build NJOY2016 from source
        # Build instructions: https://docs.njoy21.io/install.html
        run: |
          njoy_source="$RUNNER_TEMP/njoy2016"
          njoy_build="$RUNNER_TEMP/njoy-build"
          git clone --depth 1 --branch 2016.78 https://github.com/njoy/NJOY2016.git "$njoy_source"
          cmake -S "$njoy_source" -B "$njoy_build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$njoy_build" --parallel 2
          test -x "$njoy_build/njoy"
          echo "$njoy_build" >> "$GITHUB_PATH"
          printf 'TARA_NJOY_EXEC=%s\n' "$njoy_build/njoy" >> "$GITHUB_ENV"

      - name: Install TARA and test dependencies
        run: python -m pip install ".[test]" matplotlib

      - name: Run a native LEAPR smoke test
        # Use the checked-in deck so CI can exercise NJOY without patching pytest files.
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from processing.backends.njoy_processor import NjoyProcessor

          deck = Path("tests/fixtures/input_2.leapr").read_text(encoding="ascii")
          with TemporaryDirectory() as directory:
              output = Path(directory) / "graphite.endf"
              processor = NjoyProcessor(njoy_exec=os.environ["TARA_NJOY_EXEC"], temp_dir=directory)
              processor.execute_leapr(deck, str(output))
              if not output.is_file() or output.stat().st_size == 0:
                  raise RuntimeError("NJOY LEAPR produced no thermal scattering table")
          PY

      - name: Run tests
        run: python -m pytest -ra

  notebooks:
    name: Notebooks (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: njoy
            label: NJOY
          - engine: ncrystal
            label: NCrystal

    env:
      MPLBACKEND: Agg
      NOTEBOOK_ENGINE: ${{ matrix.engine }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ gfortran

      - name: Build NJOY2016 from source
        # NCrystal ACE notebooks also use NJOY for the final conversion.
        # https://docs.njoy21.io/install.html
        run: |
          njoy_source="$RUNNER_TEMP/njoy2016"
          njoy_build="$RUNNER_TEMP/njoy-build"
          git clone --depth 1 --branch 2016.78 https://github.com/njoy/NJOY2016.git "$njoy_source"
          cmake -S "$njoy_source" -B "$njoy_build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$njoy_build" --parallel 2
          test -x "$njoy_build/njoy"
          echo "$njoy_build" >> "$GITHUB_PATH"
          printf 'NJOY_EXEC=%s\nTARA_NJOY_EXEC=%s\n' "$njoy_build/njoy" "$njoy_build/njoy" >> "$GITHUB_ENV"

      - name: Install TARA and notebook dependencies
        # TARA's pyproject.toml installs the Liquids plugin from GitHub.
        run: python -m pip install . nbclient nbformat ipykernel matplotlib seaborn

      - name: Verify the NCrystal Liquids plugin
        if: matrix.engine == 'ncrystal'
        run: |
          python - <<'PY'
          from NCrystal.plugins import browsePlugins

          plugins = [name for name, _, _ in browsePlugins()]
          if "Liquids" not in plugins:
              raise SystemExit(f"NCrystal did not load the Liquids plugin. Loaded: {plugins}")
          print("NCrystal loaded the Liquids plugin.")
          PY

      - name: Register the CI Python kernel
        run: python -m ipykernel install --user --name tara-ci

      - name: Run notebooks
        run: |
          python scripts/run_all_notebooks.py notebooks \
            --engine "$NOTEBOOK_ENGINE" --kernel tara-ci --timeout 1800 \
            --report "notebook-report-$NOTEBOOK_ENGINE.json"

      - name: Upload the notebook execution report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: notebook-report-${{ matrix.engine }}
          path: notebook-report-${{ matrix.engine }}.json
